version: '3.8'

services:
  api:
    build: .
    container_name: smart_retail_api
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: always

  dashboard:
    build: .
    container_name: smart_retail_dashboard
    ports:
      - "8501:8501"
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - api
    restart: always
